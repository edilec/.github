    <circle cx="58" cy="406" r="6" fill="#7BE2A5"/>
    <text x="78" y="412" fill="#D8E2DD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">project rules take precedence</text>
