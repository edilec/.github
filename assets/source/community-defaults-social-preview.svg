      <path d="M29 31h14M29 37h10M29 43h7" stroke="#83DBA7" stroke-width="2" stroke-linecap="round"/>
      <text x="70" y="32" fill="#D8E2DD" font-size="15" font-weight="700">SUPPORT.md</text>
      <text x="70" y="51" fill="#77877F" font-size="11" font-weight="600">scope and triage</text>
    </g>

