      <path d="m28 36 5 5 11-13" fill="none" stroke="#83DBA7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="32" fill="#D8E2DD" font-size="15" font-weight="700">CONTRIBUTING.md</text>
      <text x="70" y="51" fill="#77877F" font-size="11" font-weight="600">reviewable change path</text>
    </g>

