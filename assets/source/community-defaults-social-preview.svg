<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="defaults-title defaults-description">
  <title id="defaults-title">Edilec community defaults repository preview</title>
  <desc id="defaults-description">An Edilec open-source card showing security, contribution, support, and governance documents forming a shared repository baseline.</desc>
  <defs>
    <linearGradient id="defaults-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D0C"/>
      <stop offset="1" stop-color="#111915"/>
    </linearGradient>
    <linearGradient id="defaults-emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A7F3C4"/>
      <stop offset="1" stop-color="#58C98A"/>
    </linearGradient>
    <pattern id="defaults-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#DDE8E1" stroke-opacity="0.05"/>
    </pattern>
    <filter id="defaults-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#defaults-background)"/>
  <rect width="1280" height="640" fill="url(#defaults-grid)"/>
  <rect width="12" height="640" fill="url(#defaults-emerald)"/>

  <g transform="translate(76 64)">
