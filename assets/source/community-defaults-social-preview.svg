    </g>
    <text x="64" y="37" fill="#F4F7F5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="650" letter-spacing="7">EDILEC</text>
    <text x="0" y="105" fill="#83DBA7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="3">OPEN SOURCE / GOVERNANCE</text>
  </g>

  <g transform="translate(76 225)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="0" fill="#F4F7F5" font-size="64" font-weight="730" letter-spacing="-2">Community</text>
    <text x="0" y="72" fill="#F4F7F5" font-size="64" font-weight="730" letter-spacing="-2">defaults</text>
    <text x="1" y="132" fill="#AEB9B3" font-size="25" font-weight="450">A shared baseline. Project-specific guidance wins.</text>
  </g>

  <g transform="translate(78 506)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
