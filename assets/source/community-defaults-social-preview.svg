    <path d="M257 226h42" stroke="#83DBA7" stroke-width="4" stroke-linecap="round"/>
    <path d="m288 215 11 11-11 11" fill="none" stroke="#83DBA7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="312" y="132" width="74" height="192" rx="20" fill="#102019" stroke="#4F7E65"/>
    <path d="M349 168c15 11 22 12 22 12v31c0 18-9 31-22 39-13-8-22-21-22-39v-31s7-1 22-12Z" fill="#173E2B" stroke="#7BE2A5" stroke-width="2"/>
    <path d="m339 210 7 7 14-17" fill="none" stroke="#A7F3C4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="349" y="282" fill="#A7F3C4" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">DEFAULT</text>
    <text x="349" y="300" fill="#8C9C93" font-size="10" font-weight="650" text-anchor="middle">unless overridden</text>

