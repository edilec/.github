    <circle cx="158" cy="-7" r="3" fill="#526059"/>
    <text x="180" y="0" fill="#B8C3BD" font-size="17" font-weight="650" letter-spacing="2">CONTRIBUTING</text>
    <circle cx="366" cy="-7" r="3" fill="#526059"/>
    <text x="388" y="0" fill="#B8C3BD" font-size="17" font-weight="650" letter-spacing="2">SUPPORT</text>
